[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "omarchy-voice"
version = "0.3.1"
description = "Local wake-word and hotkey transcription with bounded desktop control for Omarchy"
requires-python = ">=3.11"
dependencies = ["PySide6==6.11.2", "faster-whisper==1.2.1", "sounddevice==0.5.5", "numpy>=1.26,<3", "sherpa-onnx==1.13.8", "sentencepiece==0.2.2"]

[project.scripts]
school-voice = "school_voice.cli:main"

[tool.setuptools.packages.find]
include = ["school_voice*"]
